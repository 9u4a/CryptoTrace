plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.cryptotrace'
version = '0.1.0'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    // Montoya API is provided by the Burp runtime -> compileOnly (not bundled).
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2023.12.1'
    implementation 'com.google.code.gson:gson:2.10.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testCompileOnly 'net.portswigger.burp.extensions:montoya-api:2023.12.1'
    testRuntimeOnly 'net.portswigger.burp.extensions:montoya-api:2023.12.1'
}

test {
    useJUnitPlatform()
    // Integration test talks to the real Node server in ../server.
    systemProperty 'cryptotrace.root', rootProject.projectDir.parentFile.absolutePath
}

shadowJar {
    archiveBaseName.set('cryptotrace')
    archiveClassifier.set('all')
    archiveVersion.set(version)
    relocate 'com.google.gson', 'com.cryptotrace.shaded.gson'
}

build.dependsOn shadowJar

// Only the shadow "-all" jar is loadable in Burp (Gson bundled).
jar {
    enabled = false
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
