<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>CryptoTrace Panel</title>
<style>
  :root {
    --bg: #ffffff; --toolbar: #f3f3f3; --text: #202124; --muted: #5f6368;
    --border: #cacccd; --input-bg: #ffffff; --accent: #1a73e8; --btn-bg: #ffffff;
    --btn-hover: #e8eaed; --on: #188038; --off: #5f6368; --row-alt: #f8f9fa;
    --sel: #d2e3fc; --enc: #b3261e; --enc-bg: #fce8e6; --dec: #137333; --dec-bg: #e6f4ea; --key: #a142f4;
  }
  body.theme-dark {
    --bg: #282828; --toolbar: #333333; --text: #e3e3e3; --muted: #9aa0a6;
    --border: #494c50; --input-bg: #1e1e1e; --accent: #8ab4f8; --btn-bg: #3c4043;
    --btn-hover: #4a4e52; --on: #81c995; --off: #9aa0a6; --row-alt: #2d2d2d;
    --sel: #394457; --enc: #f28b82; --enc-bg: #4a2725; --dec: #81c995; --dec-bg: #24382b; --key: #d7aefb;
  }
  @media (prefers-color-scheme: dark) {
    body:not(.theme-light) {
      --bg: #282828; --toolbar: #333333; --text: #e3e3e3; --muted: #9aa0a6;
      --border: #494c50; --input-bg: #1e1e1e; --accent: #8ab4f8; --btn-bg: #3c4043;
      --btn-hover: #4a4e52; --on: #81c995; --off: #9aa0a6; --row-alt: #2d2d2d;
    --sel: #394457; --enc: #f28b82; --enc-bg: #4a2725; --dec: #81c995; --dec-bg: #24382b; --key: #d7aefb;
    }
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 12px system-ui, sans-serif; display: flex; flex-direction: column; }
  #toolbar { background: var(--toolbar); border-bottom: 1px solid var(--border); padding: 6px 8px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  button { background: var(--btn-bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 3px 10px; cursor: pointer; }
  button:hover { background: var(--btn-hover); }
  button.on { border-color: var(--on); color: var(--on); font-weight: 600; }
  .sep { flex: 1; }
  #status { color: var(--muted); }
  #statusbar { background: var(--toolbar); border-top: 1px solid var(--border); padding: 4px 8px; min-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  body.theme-dark button.primary { color: #202124; }
  .group { display: flex; gap: 6px; align-items: center; }
  .divider { width: 1px; align-self: stretch; background: var(--border); margin: 0 2px; }
  #count { color: var(--muted); }
  #list { flex: 1; overflow: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--border); vertical-align: top; white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--toolbar); z-index: 1; }
  tr:nth-child(even) td { background: var(--row-alt); }
  td.val { max-width: 320px; overflow: hidden; text-overflow: ellipsis; font-family: monospace; }
  .loc.link { color: var(--accent); cursor: pointer; text-decoration: underline; }
  .tag { display: inline-block; padding: 0 5px; border: 1px solid var(--border); border-radius: 3px; color: var(--muted); }
  .apply { color: var(--on); }
  #empty { padding: 24px; color: var(--muted); }
  #burpBar { background: var(--toolbar); border-bottom: 1px solid var(--border); padding: 6px 8px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #burpBar[hidden] { display: none; }
  input { background: var(--input-bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; }
  .hint { color: var(--muted); }
  /* selection + op badges */
  tbody tr { cursor: pointer; }
  tbody tr.sel td { background: var(--sel) !important; }
  tbody tr.aux td { color: var(--muted); }
  .op { display: inline-block; min-width: 54px; text-align: center; padding: 0 6px; border-radius: 3px; font-weight: 600; font-family: system-ui, sans-serif; }
  .op-encrypt { background: var(--enc-bg); color: var(--enc); }
  .op-decrypt { background: var(--dec-bg); color: var(--dec); }
  .op-other { background: var(--row-alt); color: var(--muted); border: 1px solid var(--border); }
  #filterLbl { color: var(--muted); }
  /* detail pane */
  #split { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #list { flex: 0 1 auto; max-height: 45%; min-height: 80px; }
  #detail { flex: 1 1 60%; min-height: 120px; overflow: auto; border-top: 2px solid var(--border); padding: 8px 12px; }
  #detail[hidden] { display: none; }
  #dHead { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; font-size: 13px; }
  #dHead b { font-size: 14px; }
  .kv { display: grid; grid-template-columns: 92px 1fr; gap: 4px 10px; align-items: start; }
  .kv > .k { color: var(--muted); font-weight: 600; padding-top: 3px; }
  .kv > .k small { display: block; font-weight: 400; }
  .v { margin: 0; font: 12px/1.45 Consolas, "SF Mono", monospace; background: var(--input-bg); border: 1px solid var(--border); border-radius: 4px; padding: 3px 8px; white-space: pre-wrap; word-break: break-all; max-height: 220px; overflow: auto; }
  .v.secret { border-color: var(--key); color: var(--key); font-weight: 600; }
  .v.plain { border-color: var(--on); }
  .v.empty { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<div id="toolbar">
  <div class="group">
    <button id="hook">Hook OFF</button>
    <button id="clear">Clear</button>
    <span id="count">0 calls</span>
    <label id="filterLbl" title="importKey / digest / hash 등 보조 호출 숨김"><input id="onlyCipher" type="checkbox" /> encrypt/decrypt만</label>
  </div>
  <span class="sep"></span>
  <div class="group">
    <button id="sendBurp" class="primary" title="캡처한 설정을 Burp CryptoTrace로 바로 보내 로드·자가검증">Send to Burp</button>
    <button id="export" title="config.json 파일로 저장 (손으로 고칠 초안)">Export</button>
    <span class="divider"></span>
    <button id="burpToggle" title="Burp 연결 설정 (포트·토큰·자동 전송)">Burp 설정</button>
  </div>
</div>
<div id="burpBar" hidden>
  <label>Port <input id="burpPort" size="6" /></label>
  <label>Token <input id="burpToken" type="password" size="34" placeholder="Burp &gt; CryptoTrace 탭에서 복사" /></label>
  <label><input id="autoSend" type="checkbox" /> 자동 전송</label>
  <button id="burpSave">Save &amp; test</button>
  <span class="hint" title="Burp > CryptoTrace 탭 상단의 Copy token. 127.0.0.1로만 전송합니다.">처음 한 번만 토큰을 붙여 넣으면 됩니다</span>
</div>
<div id="split">
<div id="list">
  <div id="empty">Hook ON을 누르면 탭을 새로고침하고 암호화 호출을 기록합니다.</div>
  <table id="table" hidden>
    <thead><tr>
      <th>#</th><th>lib</th><th>op</th><th>alg</th><th>key</th><th>iv</th>
      <th>input</th><th>output</th><th>apply</th><th>site</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<div id="detail" hidden>
  <div id="dHead"></div>
  <div class="kv" id="dBody"></div>
</div>
</div>
<div id="statusbar"><span id="status"></span></div>
<script src="config-builder.js"></script>
<script src="bridge-client.js"></script>
<script src="panel.js"></script>
</body>
</html>
